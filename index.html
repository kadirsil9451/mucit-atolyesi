<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mucit Atölyesi">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Mucit Atölyesi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Patrick+Hand&display=swap">
<style>
/* Layout: a drafting table. Blueprint paper is the room; pale part-tags and patent sheets sit on it; the saz neck is the one warm object. */
:root{
  color-scheme:dark;
  --paper:#123a6b; --paper-deep:#0c2a50; --grid:rgba(190,220,255,.10);
  --chalk:#e6f0ff; --chalk-dim:#a9c5e8;
  --sheet:#f5f8fe; --ink:#16304e; --ink-soft:#587089;
  --brass:#ffc23d; --stamp:#e8452c; --ok:#58d99a; --okdeep:#14804f;
  --walnut:#6b3b20; --walnut-deep:#472412; --string:#efe2c4;
  --display:"Baloo 2",ui-rounded,"Trebuchet MS",system-ui,sans-serif;
  --hand:"Patrick Hand","Comic Sans MS",ui-rounded,system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--paper);color:var(--chalk);font-family:var(--display);font-size:17px;line-height:1.35;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{-webkit-user-select:text;user-select:text}
#app{padding-block:10px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:14px}
.wrap>*{min-width:0}
.wrap .wrap{width:100%}
h1,h2,p{margin:0}
h1{font-size:clamp(2.5rem,11vw,3.9rem);line-height:.98;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:1.5rem;line-height:1.1;font-weight:800;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,.lane:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand{font-weight:800;font-size:1rem;color:var(--chalk);min-height:44px;padding-right:8px}
.gears{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.15rem;color:var(--brass);font-variant-numeric:tabular-nums}
.gears svg{width:26px;height:26px}
.gears.bump svg{animation:spinOnce .55s ease-out}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps li{font-size:.76rem;line-height:1.1;text-align:center;color:var(--chalk-dim);border-top:4px solid rgba(190,220,255,.25);padding-top:4px;font-weight:700}
.steps li.done{border-color:var(--ok);color:var(--ok)}
.steps li.on{border-color:var(--brass);color:var(--brass)}
.steps small{display:block;font-size:.68rem;font-weight:500;opacity:.85}

.btn{font-weight:800;font-size:1.15rem;min-height:54px;padding:8px 20px;border-radius:14px;background:var(--brass);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#5d7ba0;color:#c7d8ee;box-shadow:none;cursor:default}
.ghost{font-weight:700;font-size:1rem;min-height:48px;padding:6px 14px;border-radius:12px;border:2px solid var(--chalk-dim);color:var(--chalk)}
.ghost:active{background:rgba(190,220,255,.15)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}

.vida{display:flex;gap:10px;align-items:center}
.vida svg{flex:none;width:68px;height:80px}
.vida.talk svg{animation:bob .35s ease-in-out infinite alternate}
.bubble{background:var(--sheet);color:var(--ink);padding:10px 14px;border-radius:14px;font-weight:500;flex:1;min-width:0;font-size:1.05rem}

.sheet{background:var(--sheet);color:var(--ink);border-radius:8px;padding:12px;box-shadow:0 3px 0 rgba(8,25,48,.55)}
.hand{font-family:var(--hand)}
.draw svg{display:block;width:100%;height:auto;max-height:290px}
.cap{font-family:var(--hand);font-size:1.25rem;line-height:1.2;color:var(--ink);text-align:center}
.tag{font-family:var(--hand);color:var(--chalk-dim);font-size:1.05rem}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.map li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;font-size:1.05rem}
.map b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);color:var(--brass);font-weight:800}
.map span span{color:var(--chalk-dim)}

.tb{font-weight:700;font-size:1rem;min-height:48px;padding:6px 14px;border-radius:10px;border:2px solid var(--ink);color:var(--ink)}
.tune{display:grid;gap:8px}
.tune strong{font-size:1.2rem;line-height:1.1}
.levels{display:grid;gap:8px}
@media(min-width:620px){.levels{grid-template-columns:1fr 1fr}}
.lv{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px 12px;min-height:62px;box-shadow:0 3px 0 rgba(8,25,48,.55)}
.lv b{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--brass);font-weight:800;font-size:1.15rem}
.lv strong{display:block;font-size:1.15rem;line-height:1.1}
.lv small{display:block;font-family:var(--hand);font-size:1rem;color:var(--ink-soft);line-height:1.1}
.lv em{font-style:normal;font-weight:800;font-size:.9rem;color:var(--ink-soft)}
.lv.ok b{background:var(--ok)}.lv.ok em{color:var(--okdeep)}
.lv[disabled]{background:#3a5f8e;color:#c7d8ee;box-shadow:none}.lv[disabled] small,.lv[disabled] em{color:#c7d8ee}.lv[disabled] b{background:#5d7ba0}
select{font:inherit;font-weight:700;padding:10px;border-radius:10px;background:var(--sheet);color:var(--ink);border:0;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:560px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{background:var(--sheet);color:var(--ink);border-radius:8px;padding:8px;display:grid;justify-items:center;gap:0;box-shadow:0 4px 0 rgba(8,25,48,.6);border:3px solid transparent}
.card svg{width:100%;max-width:120px;height:auto;display:block}
.card:active{transform:translateY(2px)}
.card .en{font-weight:800;font-size:1.2rem;line-height:1.1}
.card .tr{font-size:.9rem;color:var(--ink-soft);line-height:1.1}
.card .small{font-family:var(--hand);font-size:1.05rem;line-height:1.05;text-align:center}
.card.heard{border-color:var(--ok)}
.card.ok{border-color:var(--okdeep);background:#d5f5e4}
.card.sel{border-color:var(--stamp);background:#ffe9d9}
.shake{animation:shake .32s}
.belt{display:flex;gap:6px;flex-wrap:wrap;min-height:44px}
.belt svg{width:44px;height:44px;background:var(--sheet);border-radius:6px}

.bodies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bodies .card svg{max-width:96px}
.two{display:grid;gap:14px}
@media(min-width:680px){.two{grid-template-columns:1fr 1fr;align-items:start}}
.two>*{min-width:0}

.lines{font-size:1.25rem;font-weight:700;display:grid;gap:4px;line-height:1.2}
.lines .blank{display:inline-block;min-width:4ch;border-bottom:3px solid var(--stamp);color:var(--stamp);padding:0 3px;letter-spacing:.06em}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{width:54px;height:58px;border-radius:10px;background:var(--sheet);color:var(--ink);font-size:1.7rem;font-weight:800;box-shadow:0 4px 0 rgba(8,25,48,.6)}
.tile[disabled]{opacity:.18;box-shadow:none}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.3rem;font-weight:800}
input[type=text]{font:inherit;font-weight:800;font-size:1.3rem;padding:8px 10px;border-radius:10px;border:3px solid var(--ink);background:#fff;color:var(--ink);width:9.5em;max-width:100%;box-sizing:border-box}
.cert{position:relative;overflow:hidden;display:grid;gap:8px}
.cert .no{font-family:var(--hand);color:var(--ink-soft);font-size:1.1rem;display:flex;justify-content:space-between;gap:8px}
.cert .nm{font-size:1.65rem;font-weight:800;line-height:1.05}
.stamp{position:absolute;right:10px;bottom:10px;border:4px solid var(--stamp);color:var(--stamp);font-weight:800;font-size:1.05rem;padding:2px 10px;border-radius:8px;transform:rotate(-12deg);background:rgba(245,248,254,.85);animation:stamp .4s cubic-bezier(.2,1.4,.5,1)}

.judges{display:flex;justify-content:center;gap:16px}
.judges svg{width:78px;height:92px}
.clap .pad{animation:paddle .5s ease-out}
.say{font-size:1.75rem;font-weight:800;line-height:1.25;text-align:center;display:flex;flex-wrap:wrap;gap:0 .32em;justify-content:center;min-height:2.6em;align-content:center}
.say span{color:var(--chalk);transition:color .1s}
.say span.lit{color:var(--brass)}
.say span.good{color:var(--ok)}
.note{font-size:.98rem;color:var(--chalk-dim);text-align:center}

.line-now{text-align:center;font-weight:800;font-size:1.25rem;min-height:1.7em;color:var(--brass)}
.hw{background:linear-gradient(180deg,var(--walnut),var(--walnut-deep));border-radius:12px;padding:6px 0;display:grid;gap:0;position:relative;overflow:hidden;box-shadow:0 5px 0 rgba(8,25,48,.6)}
.hw::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 62px,rgba(255,226,170,.28) 62px 65px);pointer-events:none}
.lane{position:relative;display:block;width:100%;height:clamp(76px,15vh,108px);overflow:hidden;touch-action:none}
.lane::before,.lane::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--string);opacity:.95}
.lane::before{top:calc(50% - 4px)}.lane::after{top:calc(50% + 3px)}
.lane.pl{background:rgba(255,194,61,.17)}
.lane.pl::before,.lane.pl::after{animation:vib .16s linear 2}
.lane i{position:absolute;left:8px;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;border:3px dashed var(--brass);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.86rem;color:var(--brass);background:var(--walnut-deep);z-index:2}
.n{position:absolute;left:0;top:50%;margin-top:-22px;width:44px;height:44px;border-radius:50%;background:var(--brass);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:.95rem;will-change:transform;z-index:3;box-shadow:0 2px 0 var(--ink)}
.n.hit{background:var(--ok);transition:opacity .25s;opacity:0}
.n.miss{background:#a58f76;color:#47331f}
.pop{position:absolute;left:58px;top:6px;font-weight:800;color:var(--ok);font-size:1.15rem;z-index:4;animation:rise .55s forwards;pointer-events:none}

.frets{overflow-x:auto;border-radius:12px;background:linear-gradient(180deg,var(--walnut),var(--walnut-deep));padding:6px}
.fgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.fret{height:74px;border-radius:6px;background:rgba(255,226,170,.14);color:var(--string);font-weight:800;font-size:.86rem}
.fret:active,.fret.pl{background:var(--brass);color:var(--ink)}

.win{font-size:clamp(2.6rem,12vw,4rem);line-height:1;font-weight:800;color:var(--brass);text-align:center}
.running .a-wheel{animation:spin 1s linear infinite}
.running .a-propeller{animation:spin .35s linear infinite}
.running .a-wing{animation:flap .4s ease-in-out infinite alternate}
.running .a-lamp{animation:glow .5s ease-in-out infinite alternate}
.running .a-spring{animation:bounce .4s ease-in-out infinite alternate}
.running .a-magnet{animation:wiggle .3s ease-in-out infinite alternate}
.running .a-engine{animation:rumble .1s linear infinite alternate}
.running .a-box{animation:bounce .55s ease-in-out infinite alternate}
.running .a-body{animation:bob .45s ease-in-out infinite alternate}
.a-wheel,.a-propeller,.a-wing,.a-lamp,.a-spring,.a-magnet,.a-engine,.a-box,.a-body{transform-box:fill-box;transform-origin:center}
.book{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;text-align:left;width:100%}
.book svg{width:96px;height:auto;display:block}
.book b{font-size:1.2rem;line-height:1.1;display:block}
.book span{font-family:var(--hand);font-size:1.05rem;line-height:1.15;display:block}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinOnce{to{transform:rotate(180deg) scale(1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes flap{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes glow{from{opacity:.6}to{opacity:1}}
@keyframes bounce{from{transform:scaleY(1)}to{transform:scaleY(.72)}}
@keyframes wiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes rumble{from{transform:translate(-1px,1px)}to{transform:translate(1px,-1px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
@keyframes paddle{40%{transform:translateY(-12px)}}
@keyframes rise{to{transform:translateY(-22px);opacity:0}}
@keyframes vib{50%{transform:translateY(1.5px)}}
@media(prefers-reduced-motion:reduce){
  .vida.talk svg,.running *,.shake,.stamp,.clap .pad,.pop,.gears.bump svg{animation:none!important}
}
</style>

</head>
<body>
<div id="app"><div class="wrap">
  <header class="top">
    <button class="brand" id="homeBtn" type="button">Mucit Atölyesi</button>
    <div class="gears" id="gears" aria-label="Dişli sayın"></div>
  </header>
  <ol class="steps" id="steps" hidden></ol>
  <p id="ttsnote" class="sheet" role="status" hidden></p>
  <main id="main" class="wrap"></main>
</div></div>

<script>
'use strict';
const REPORT_URL='https://script.google.com/macros/s/AKfycbz6nfSrg2KMMStlmOBS3R2BlDwJuXYQRx0sfLeOSSwrKEtw8-q5ttaNEuYlPLGSI3ig/exec';
const TEST=location.hash==='#test';
/* ---------- data ---------- */
const INK='#16304e';
const COLORS={red:{hex:'#ff5a4f',tr:'kırmızı'},blue:{hex:'#2f86ea',tr:'mavi'},yellow:{hex:'#ffc21f',tr:'sarı'}};
const SIZES={small:{k:.6,tr:'küçük'},big:{k:1,tr:'büyük'}};
const PARTS={
  wheel:{tr:'tekerlek',adj:'Rolling',pre:'It can ',word:'roll',post:'.'},
  wing:{tr:'kanat',adj:'Flying',pre:'It can ',word:'fly',post:'.'},
  lamp:{tr:'lamba',adj:'Shining',pre:'It can ',word:'shine',post:'.'},
  spring:{tr:'yay',adj:'Jumping',pre:'It can ',word:'jump',post:'.'},
  magnet:{tr:'mıknatıs',adj:'Magnet',pre:'It can ',word:'pull',post:' metal.'},
  propeller:{tr:'pervane',adj:'Spinning',pre:'It can ',word:'spin',post:'.'},
  engine:{tr:'motor',adj:'Fast',pre:'It can go ',word:'fast',post:'.'},
  box:{tr:'kutu',adj:'Carrying',pre:'It can ',word:'carry',post:' toys.'}
};
const BODIES={bicycle:{tr:'bisiklet',En:'Bicycle'},shoe:{tr:'ayakkabı',En:'Shoe'},bed:{tr:'yatak',En:'Bed'}};
const STEPS=[['Depo','Dinleme'],['Atölye','Okuma'],['Patent','Yazma'],['Jüri','Konuşma'],['Saz','Ritim']];

/* ---------- storage ---------- */
const KEY='mucit-atolyesi-v1';
let S={gears:0,played:0,weak:{},book:[],log:[],done:[],songs:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
if(S.played>0&&!S.done.length)S.done=[0];
function save(){if(TEST)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let gen=0;
function later(fn,ms){const g=gen;setTimeout(()=>{if(g===gen)fn();},ms);}
function show(html,step){
  gen++;
  try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}
  $('#main').innerHTML=html;
  const st=$('#steps');
  if(step==null){st.hidden=true;}
  else{st.hidden=false;st.innerHTML=STEPS.map((s,i)=>`<li class="${i<step?'done':i===step?'on':''}">${i+1}. ${s[0]}<small>${s[1]}</small></li>`).join('');}
  window.scrollTo(0,0);
  exitArm=false;$('#homeBtn').textContent='Mucit Atölyesi';inGame=step!=null;
}
const GEAR=`<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffc23d" d="M10 1h4l.6 3 2.2.9 2.6-1.7 2.8 2.8-1.7 2.6.9 2.2 3 .6v4l-3 .6-.9 2.2 1.7 2.6-2.8 2.8-2.6-1.7-2.2.9-.6 3h-4l-.6-3-2.2-.9-2.6 1.7-2.8-2.8 1.7-2.6-.9-2.2-3-.6v-4l3-.6.9-2.2L2.8 5.8 5.6 3l2.6 1.7L10.4 4zM12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>`;
function drawGears(bump){const g=$('#gears');g.innerHTML=GEAR+`<span>${S.gears}</span>`;if(bump){g.classList.remove('bump');void g.offsetWidth;g.classList.add('bump');}}
function addGears(n){if(n>0){S.gears+=n;save();drawGears(true);}}

/* ---------- speech out ---------- */
const hasTTS='speechSynthesis' in window;
let voice=null,voiceCount=0,sayId=0;
function pickVoice(){
  if(!hasTTS)return;
  const v=speechSynthesis.getVoices();voiceCount=v.length;
  voice=v.find(x=>/^en[-_]US/i.test(x.lang)&&/google|samantha/i.test(x.name))||v.find(x=>/^en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
if(hasTTS){pickVoice();try{speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){}}
const noVoice=()=>!hasTTS||ttsBroken||(voiceCount>0&&!voice);
let ttsBroken=false,ttsUnlocked=false,ttsBegan=false;
function ttsFailed(text){
  ttsBroken=true;
  const n=$('#ttsnote');n.hidden=false;
  n.textContent=`Ses çıkmadı. Söylenen: "${text}". Bağlantıyı Chrome veya Safari'de açmayı dene.`;
}
function ttsWorked(){ttsBroken=false;$('#ttsnote').hidden=true;}
function unlockTTS(){
  if(ttsUnlocked||!hasTTS)return;
  ttsUnlocked=true;
  try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener('pointerdown',unlockTTS,{passive:true});
function talking(on){const v=$('.vida');if(v)v.classList.toggle('talk',on);}
function say(text,opt){
  const o=opt||{},rate=o.rate||.88,id=++sayId,g=gen;
  let fin=false,began=false;
  setTimeout(()=>{if(!began&&id===sayId)ttsFailed(text);},1600);
  const finish=()=>{if(fin||id!==sayId)return;fin=true;clearTimeout(t);talking(false);if(g===gen&&o.done)o.done();};
  const t=setTimeout(finish,text.split(' ').length*520/rate+1600);
  if(!hasTTS){ttsFailed(text);return;}
  talking(true);
  const go=()=>{
    if(id!==sayId)return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang=voice?voice.lang.replace('_','-'):'en-US';if(voice)u.voice=voice;u.rate=rate;
    u.onstart=()=>{began=true;ttsBegan=true;ttsWorked();};
    u.onend=finish;u.onerror=finish;
    try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){finish();}
  };
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,70);}else go();
}

/* ---------- speech in (used only where the browser allows the microphone) ---------- */
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let srOff=!SRC;
try{const p=document.permissionsPolicy||document.featurePolicy;if(p&&p.allowsFeature&&!p.allowsFeature('microphone'))srOff=true;}catch(e){}
function hear(cb){
  let got=false;const end=v=>{if(!got){got=true;cb(v);}};
  try{
    const r=new SRC();r.lang='en-US';r.interimResults=false;r.maxAlternatives=4;
    r.onresult=e=>{const a=[...e.results[0]].map(x=>x.transcript).join(' ');end(a);};

function chartFor(i){
  const lv=LEVELS[i];
  if(!lv.mel)return CHART_1;
  const sc=SC[lv.sc],out=[];
  lv.mel.forEach((ph,n)=>{
    const rh=RH[(i+n)%RH.length];
    ph.forEach((deg,k)=>{
      const p=sc[deg];let s=2,off=p;
      if(p<0){s=0;off=p+2;}
      else if(n===1&&FRETS.includes(p+2)){s=0;off=p+2;}
      else if(n===2&&FRETS.includes(p+7)){s=1;off=p+7;}
      out.push([n*8+rh[k],s,off,PCN[(9+p+24)%12]]);
    });
  });
  return out;
}
function startLevel(i){L=i;learn();}
function pool(){
  const lv=level();
  if(L===0)return shuffle(lv.items).sort((a,b)=>(S.weak[b]||0)-(S.weak[a]||0)).slice(0,6);
  const old=shuffle(LEVELS.slice(0,L).flatMap(x=>x.items)).sort((a,b)=>(S.weak[b]||0)-(S.weak[a]||0)).slice(0,2);
  return [...lv.items,...old];
}

/* ---------- DEPOT (listening) ---------- */
function makeOptions(t){
  const keys=shuffle(cur.pool.filter(k=>k!==t.type)),lv=level();
  const altC=shuffle(lv.colors.filter(c=>c!==t.color));
  const altS=lv.sizes.find(x=>x!==t.size);
  return shuffle([
    {...t},
    {type:t.type,color:altC[0],size:t.size},
    {type:t.type,color:t.color,size:altS},
    {type:keys[0],color:t.color,size:t.size},
    {type:keys[1],color:t.color,size:t.size},
    {type:keys[2],color:altC[1],size:altS}
  ]);
}
function depot(){
  const types=pool(),lv=level();
  const q=shuffle(types).map(type=>({type,color:pick(lv.colors),size:pick(lv.sizes),retry:false}));
  cur={q,pool:types,parts:[],i:0,total:6,st:{dw:[],slow:0,hint:0,tile:0,typ:0,spoken:0,spokenAll:0}};
  round();
}
function round(){
  if(cur.i>=cur.q.length){workshop();return;}
  const t=cur.q[cur.i],opts=makeOptions(t);
  const frame=pick(level().frames);
  const text=`${frame} ${phrase(t)}.`;
  let wrong=false,solved=false;
  show(`${vida(t.retry?'Bu parçayı bir daha bulalım.':'Dinle ve doğru parçaya dokun.')}
  <div class="row">
    <button class="btn" id="rep" type="button">Dinle</button>
    <button class="ghost" id="slow" type="button">Yavaş</button>
    <button class="ghost" id="hint" type="button">Türkçe ipucu</button>
    <span class="tag">Parça ${Math.min(cur.parts.length+1,6)} / 6</span>
  </div>
  <p id="said" class="hand" style="font-size:1.45rem;min-height:1.4em" aria-live="polite">${noVoice()?esc(text):''}</p>
  <div class="grid" id="opts">${opts.map((o,n)=>`<button class="card" data-n="${n}" type="button" aria-label="Parça ${n+1}">${partSVG(o)}</button>`).join('')}</div>
  <div class="belt" aria-label="Topladığın parçalar">${cur.parts.map(partSVG).join('')}</div>`,0);
  const speak=(r)=>say(text,{rate:r});
  $('#rep').onclick=()=>speak(.88);
  $('#slow').onclick=()=>{cur.st.slow++;speak(.62);};
  $('#hint').onclick=()=>{cur.st.hint++;$('#said').textContent=`${phraseTr(t)} lazım.`;};
  later(()=>speak(.88),260);
  $$('#opts .card').forEach(b=>b.onclick=()=>{
    if(solved)return;
    const o=opts[+b.dataset.n];
    if(o.type===t.type&&o.color===t.color&&o.size===t.size){
      solved=true;b.classList.add('ok');fx.ok();
      $('#said').textContent=`Yes! A ${phrase(t)}.`;
      if(!wrong){addGears(1);if(S.weak[t.type])S.weak[t.type]--;save();}
      if(!t.retry)cur.parts.push({type:t.type,color:t.color,size:t.size});
      say(`Yes! A ${phrase(t)}.`,{done:()=>later(()=>{cur.i++;round();},350)});
    }else{
      fx.no();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
      if(!wrong){wrong=true;cur.st.dw.push(phrase(t));S.weak[t.type]=(S.weak[t.type]||0)+1;save();if(!t.retry&&cur.q.length<9)cur.q.push({...t,retry:true});}
      later(()=>speak(.74),250);
    }
  });
}

    else{w.sel.push(i);const p=cur.parts[i],P=PARTS[p.type];say(`${phrase(p)}. ${P.pre}${P.word}${P.post}`);}

}

/* ---------- PATENT (writing) ---------- */
function fillT(t,p,mode){
  const a=t.replace('{a}',`${p.size} ${p.color}`).split('{i}');
  return {pre:a[0],word:p.type,post:a[1],mode,m:PARTS[p.type].tr};
}
function patent(){
  const parts=cur.w.sel.map(i=>cur.parts[i]);
  const last=parts[parts.length-1],P=PARTS[last.type];
  const body=cur.w.body;
  const tasks=[
    fillT(level().t1,parts[0],'tiles'),
    fillT(level().t2,parts[1],level().typed2?'type':'tiles'),
    {pre:P.pre,word:P.word,post:P.post,mode:'type',m:P.m}
  ];
  cur.lines=tasks.map(t=>t.pre+t.word+t.post);
  let name=PARTS[parts[0].type].adj||'Super',n=0;

  function nameStep(){
    show(`${vida('İcadına bir ad ver. Hazır adı değiştirebilirsin.')}
    <div class="sheet draw">${invSVG(body,parts)}</div>
    <div class="field"><label for="nm">The</label><input id="nm" type="text" maxlength="14" value="${esc(name)}" autocomplete="off" autocapitalize="words" spellcheck="false"><span>${BODIES[body].En}</span></div>
    <button class="btn" id="ok" type="button">Patent belgesini aç</button>`,2);
    $('#ok').onclick=()=>{name=$('#nm').value.trim()||PARTS[parts[0].type].adj||'Super';cur.name=`The ${name} ${BODIES[body].En}`;say(cur.name);later(task,50);};
  }
  function linesHTML(active){
    return tasks.map((t,i)=>{
      if(i<n)return `<div>${esc(t.pre+t.word+t.post)}</div>`;
      if(i===n&&active)return `<div>${esc(t.pre)}<span class="blank" id="blank">${active}</span>${esc(t.post)}</div>`;
      return `<div style="opacity:.3">${esc(t.pre)}____${esc(t.post)}</div>`;
    }).join('');
  }
  function task(){
    if(n>=tasks.length){cert();return;}
    const t=tasks[n];
    if(t.mode==='tiles'){
      let got=0;const letters=shuffle(t.word.split(''));
      const dash=()=>t.word.slice(0,got)+'_'.repeat(t.word.length-got);
      show(`${vida('Eksik kelimeyi harflerle kur.')}
      <div class="sheet"><p class="hand" style="font-size:1.2rem;color:var(--ink-soft)">${esc(cur.name)}</p><div class="lines">${linesHTML(dash())}</div></div>
      <div class="row"><button class="ghost" id="rep" type="button">Kelimeyi dinle</button></div>
      <div class="tiles">${letters.map((l,i)=>`<button class="tile" data-i="${i}" type="button">${l}</button>`).join('')}</div>`,2);
      $('#rep').onclick=()=>say(t.word);
      later(()=>say(t.word),200);
      $$('.tile').forEach(b=>b.onclick=()=>{
        if(letters[+b.dataset.i]===t.word[got]){
          got++;b.disabled=true;$('#blank').textContent=dash();tone(520+got*40,0,.09);
          if(got===t.word.length)finishLine();
        }else{cur.st.tile++;fx.no();b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}
      });
    }else{
      let tries=0;
      show(`${vida('Eksik kelimeyi klavyeyle yaz.')}
      <div class="sheet"><p class="hand" style="font-size:1.2rem;color:var(--ink-soft)">${esc(cur.name)}</p><div class="lines">${linesHTML('____')}</div></div>
      <div class="row"><button class="ghost" id="rep" type="button">Cümleyi dinle</button><span class="tag">İpucu: ${esc(t.m||'')}</span></div>
      <form id="f" class="field"><input id="ans" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Eksik kelime"><button class="btn" type="submit">Kontrol et</button></form>
      <p class="tag" id="hint" aria-live="polite"></p>`,2);
      const sent=t.pre+t.word+t.post;
      $('#rep').onclick=()=>say(sent);
      later(()=>say(sent),200);
      $('#f').addEventListener('submit',e=>{
        e.preventDefault();
        const v=$('#ans').value.replace(/[İI]/g,'i').replace(/ı/g,'i').trim().toLowerCase();
        if(v===t.word){$('#ans').blur();finishLine();}
        else{tries++;cur.st.typ++;fx.no();
          const shown=t.word.slice(0,Math.min(tries,t.word.length-1));
          $('#hint').textContent=`Neredeyse. Kelime şöyle başlıyor: ${shown}${'_'.repeat(t.word.length-shown.length)}`;
          say(t.word);
        }
      });
    }
  }
  function finishLine(){
    fx.ok();addGears(1);
    const t=tasks[n];n++;
    say(t.pre+t.word+t.post,{done:()=>later(task,250)});
  }
  function cert(){
    const no=String(S.book.length+1).padStart(4,'0');
    cur.no=no;
    show(`${vida('İşte patentin! Şimdi jüriye anlatalım.')}
    <div class="sheet cert"><div class="no"><span>PATENT No. ${no}</span><span>Inventor's Workshop</span></div>
      <div class="nm">${esc(cur.name)}</div>
      <div class="draw">${invSVG(body,parts)}</div>
      <div class="lines">${cur.lines.map(l=>`<div>${esc(l)}</div>`).join('')}</div>
      <div class="stamp" id="st">APPROVED</div></div>

}

const JUDGE=c=>`<svg viewBox="0 0 78 92" aria-hidden="true"><rect x="12" y="34" width="54" height="42" rx="10" fill="#f5f8fe" stroke="${INK}" stroke-width="3"/><circle cx="30" cy="52" r="5" fill="${INK}"/><circle cx="48" cy="52" r="5" fill="${INK}"/><path d="M31 64Q39 70 47 64" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><g class="pad"><rect x="20" y="3" width="38" height="24" rx="4" fill="${c}" stroke="${INK}" stroke-width="3"/><text x="39" y="21" text-anchor="middle" font-size="16" font-weight="800" fill="${INK}">10</text><path d="M39 27V34" stroke="${INK}" stroke-width="4"/></g></svg>`;
function jury(){
  let i=0;

  function ren(){
    if(i>=lines.length){done();return;}
    const words=lines[i].split(' ');
    show(`<div class="judges" id="jd">${JUDGE('#ffc23d')}${JUDGE('#58d99a')}${JUDGE('#ff8a6b')}</div>

  }

  function listen(){
    clear();$('#act').innerHTML='';

    const sp=$$('#say span');let w=0;
    const step=()=>{if(w<sp.length){sp.forEach(x=>x.classList.remove('lit'));sp[w++].classList.add('lit');later(step,430);}else later(()=>sp.forEach(x=>x.classList.remove('lit')),300);};
    step();
  }
  function turn(){
    $('#act').innerHTML=srOff
      ?`<button class="btn" id="mine" type="button">Sıra bende</button><button class="ghost" id="again" type="button">Tekrar dinle</button>`
      :`<button class="btn" id="mic" type="button">Konuş</button><button class="ghost" id="again" type="button">Tekrar dinle</button>`;
    $('#again').onclick=listen;
    if(srOff){$('#mine').onclick=pace;$('#msg').textContent='Kelimeler yandıkça yüksek sesle oku. Yanında biri varsa jüri o olsun.';}
    else{$('#mic').onclick=mic;$('#msg').textContent='Konuş düğmesine bas ve cümleyi söyle.';}
  }
  function mic(){
    clear();$('#act').innerHTML='';$('#msg').textContent='Dinliyorum…';
    hear(text=>{
      if(text===null){turn();return;}
      if(!text){$('#msg').textContent='Sesini duyamadım. Bir daha deneyelim.';turn();return;}
      const got=new Set(text.toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/));
      let m=0;const sp=$$('#say span');
      sp.forEach(s=>{const w=s.textContent.toLowerCase().replace(/[^a-z]/g,'');if(got.has(w)){s.className='good';m++;}});
      cur.st.spoken+=m;cur.st.spokenAll+=sp.length;
      $('#msg').textContent=m>=sp.length/2?'Jüri bayıldı!':'Güzel deneme, jüri alkışlıyor!';
      applaud();
    });
  }
  function pace(){
    $('#act').innerHTML='';clear();
    const sp=$$('#say span');let w=0;
    const step=()=>{
      if(w<sp.length){sp[w++].classList.add('lit');later(step,640);}
      else{
        $('#act').innerHTML=`<button class="btn" id="said" type="button">Söyledim</button><button class="ghost" id="again" type="button">Tekrar dinle</button>`;
        $('#said').onclick=applaud;$('#again').onclick=listen;
      }
    };
    step();
  }
  function applaud(){
    fx.clap();addGears(1);
    const jd=$('#jd');jd.classList.remove('clap');void jd.offsetWidth;jd.classList.add('clap');
    $('#act').innerHTML='';
    say(pick(['Wow! Great idea!','Excellent!','Bravo, inventor!','Well done!']),{done:()=>later(()=>{i++;ren();},300)});
  }
  function done(){
    show(`${vida('Üç cümlen üç ezgi parçası açtı. Şimdi sazınla icadını çalıştır.')}
    <div class="sheet draw">${invSVG(cur.w.body,cur.w.sel.map(k=>cur.parts[k]))}<p class="cap">${esc(cur.name)}</p></div>
    <button class="btn" id="next" type="button">Sazı al</button>`,3);
    $('#next').onclick=sazGame;
  }
  ren();
}

/* Original melody near makam Uşşak, tuned La-Re-Sol (bozuk düzen). s: 0 üst, 1 orta, 2 alt. */
const CHART_1=[
  [0,2,0,'La'],[1,2,3,'Do'],[2,2,5,'Re'],[2.5,2,3,'Do'],[3,2,1.5,'Si'],[4,2,0,'La'],
  [8,0,0,'Sol'],[9,0,5,'Do'],[10,0,7,'Re'],[11,2,7,'Mi'],[11.5,2,5,'Re'],[12,2,3,'Do'],
  [16,1,7,'La'],[17,1,10,'Do'],[18,1,5,'Sol'],[19,2,1.5,'Si'],[20,2,0,'La'],[22,1,7,'La']
];
let CHART=CHART_1,BEAT=760;
const TRAVEL=2700,LEAD=4;
let lanes=null,running=null;
let customSong=null,freeTime=false;
function sazGame(){
  customSong=null;freeTime=false;CHART=chartFor(L);BEAT=760-L*14;
  sazView(esc(cur.lines[0]),4);
}
function sazView(cap,step){
  show(`${vida('Sarı nota halkaya gelince o tele dokun. Önce dinleyebilirsin.')}
  <div class="line-now" id="now" aria-live="off">${cap}</div>
  <div class="hw" id="hw">${STRINGS.map((s,i)=>`<div class="lane" data-s="${i}" role="button" tabindex="0" aria-label="${s.n} teli"><i>${s.n}</i></div>`).join('')}</div>
  <div class="row c" id="act"><button class="btn" id="play" type="button">Çal</button><button class="ghost" id="demo" type="button">Önce dinle</button>${!customSong&&S.songs.length?'<button class="ghost" id="own" type="button">Son ezgimle çal</button>':''}</div>
  <p class="note" id="msg">Saz bozuk düzende: La, Re, Sol. Notaların üstünde adları yazıyor.</p>`,step);
  [...new Set(CHART.map(c=>fHz(c[1],c[2])))].forEach(pluckBuf);
  lanes=$$('.lane');
  lanes.forEach(l=>{
    l.addEventListener('pointerdown',e=>{e.preventDefault();strike(+l.dataset.s);});
    l.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();strike(+l.dataset.s);}});
  });
  $('#play').onclick=()=>start(false);
  $('#demo').onclick=()=>start(true);
  const own=$('#own');if(own)own.onclick=()=>{CHART=S.songs[0].notes;BEAT=500;freeTime=true;start(false);};
}
function flash(s){const l=lanes[s];l.classList.remove('pl');void l.offsetWidth;l.classList.add('pl');}
function popMsg(s,t){const p=document.createElement('b');p.className='pop';p.textContent=t;lanes[s].appendChild(p);setTimeout(()=>p.remove(),600);}
function strike(s){
  flash(s);
  if(!running||running.auto){pluck(STRINGS[s].f);return;}
  const now=performance.now();let best=null,bd=1e9;
  running.notes.forEach(n=>{if(n.s===s&&!n.st){const d=Math.abs(n.t-now);if(d<bd){bd=d;best=n;}}});
  if(best&&bd<=330){
    best.st=1;best.el.classList.add('hit');pluck(best.f);
    running.hits++;popMsg(s,bd<=150?'Tam!':'İyi');
    $('#msg').textContent=`${running.hits} / ${CHART.length} nota`;
  }else pluck(STRINGS[s].f,.32);
}
function start(auto){
  const g=gen;
  $('#act').hidden=true;$('#msg').textContent=auto?'Dinle, notaların sırasını izle.':`0 / ${CHART.length} nota`;
  const t0=performance.now()+Math.max(LEAD*BEAT,3000);
  const notes=CHART.map(c=>{
    const el=document.createElement('div');el.className='n';el.textContent=c[3];el.style.transform='translate3d(-99px,0,0)';
    lanes[c[1]].appendChild(el);
    return {t:t0+c[0]*BEAT,b:c[0],s:c[1],f:fHz(c[1],c[2]),el,st:0};
  });
  running={auto,notes,hits:0};
  const end=t0+CHART[CHART.length-1][0]*BEAT+1100;
  const W=lanes[0].clientWidth,hit=8,speed=(W-hit)/TRAVEL;
  let lastBeat=-99;
  const now=$('#now');
  (function loop(){
    if(g!==gen){running=null;return;}
    const ts=performance.now(),beat=Math.floor((ts-t0)/BEAT);
    if(!freeTime&&beat!==lastBeat&&beat>=-LEAD&&ts<end-900){lastBeat=beat;fx.tick();}
    const b=(ts-t0)/BEAT,idx=b<7?0:b<15?1:2;
    if(!customSong&&now.dataset.i!=String(idx)){now.dataset.i=idx;now.textContent=cur.lines[idx];}
    notes.forEach(n=>{
      const x=hit+(n.t-ts)*speed;
      if(!n.st||n.st===2)n.el.style.transform=`translate3d(${x.toFixed(1)}px,0,0)`;
      if(auto&&!n.st&&ts>=n.t){n.st=1;n.el.classList.add('hit');pluck(n.f);flash(n.s);}
      if(!auto&&!n.st&&ts>n.t+330){n.st=2;n.el.classList.add('miss');}
    });
    if(ts<end){requestAnimationFrame(loop);return;}
    const res=running;running=null;
    notes.forEach(n=>n.el.remove());
    if(auto){
      $('#act').hidden=false;$('#msg').textContent='Hazırsan Çal düğmesine bas.';if(!customSong){now.textContent=cur.lines[0];delete now.dataset.i;}
    }else if(customSong)tuneDone(res.hits);else result(res.hits);
  })();
}
function result(hits){
  const pct=hits/CHART.length,earn=pct>=.7?3:pct>=.4?2:1;
  addGears(earn);S.played++;if(!S.done.includes(L))S.done.push(L);
  const parts=cur.w.sel.map(k=>cur.parts[k]);
  S.book.unshift({no:cur.no,name:cur.name,body:cur.w.body,parts,lines:cur.lines,hits});
  S.book=S.book.slice(0,40);
  S.log.unshift({d:new Date().toISOString().slice(0,10),n:`B${L+1}: ${cur.name}`,hits,t:CHART.length,...cur.st});
  S.log=S.log.slice(0,20);save();
  sendReport(hits);
  show(`<p class="win">It works!</p>
  <div class="sheet draw running">${invSVG(cur.w.body,parts)}<p class="cap">${esc(cur.name)}</p></div>
  <p style="text-align:center;font-size:1.15rem">${hits} / ${CHART.length} nota tuttu, ${earn} dişli kazandın. İcadın Mucit Defteri'ne girdi.</p>
  <div class="row c">
    <button class="btn" id="nx" type="button">${L+1<LEVELS.length?'Sonraki bölüm':'Bölümlere dön'}</button>
    <button class="ghost" id="again" type="button">Bu bölümü tekrar oyna</button>
    <button class="ghost" id="bk" type="button">Mucit Defteri</button>
    <button class="ghost" id="fs" type="button">Serbest saz</button>
  </div>`);
  fx.clap();say('It works!');
  CHART.slice(-4).forEach((c,i)=>setTimeout(()=>pluck(fHz(c[1],c[2])),600+i*260));
  $('#nx').onclick=()=>{if(L+1<LEVELS.length)startLevel(L+1);else home();};$('#again').onclick=learn;$('#bk').onclick=book;$('#fs').onclick=freeSaz;
}

let flushing=false;

  show(`<h2>Kendi Ezgim</h2>
  <p>Sazda bir ezgi çal, oyun kaydetsin. Sonra notaları kayarak gelsin, sen de çalışıp skor yap.</p>
  <div class="wrap">${list||'<p class="tag">Henüz ezgin yok. İlk ezgini kaydet.</p>'}</div>
  <div class="row"><button class="btn" id="newT" type="button" ${S.songs.length>=MAX_SONGS?'disabled':''}>Yeni ezgi kaydet</button><button class="ghost" id="back" type="button">Atölyeye dön</button></div>
  ${S.songs.length>=MAX_SONGS?'<p class="note">En çok 5 ezgi saklanır. Yeni kayıt için birini sil.</p>':''}`);
  $('#newT').onclick=recordTune;
  $('#back').onclick=TEST?testPanel:home;
  $$('[data-p]').forEach(b=>b.onclick=()=>playTune(S.songs[+b.dataset.p],500));
  $$('[data-s]').forEach(b=>b.onclick=()=>playTune(S.songs[+b.dataset.s],760));
  $$('[data-x]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.x;
    if(armed!==i){armed=i;b.textContent='Silmek için tekrar dokun';return;}
    S.songs.splice(i,1);save();tunes();
  });
}
function recordTune(){
  let rec=[],last=0,clock=0;
  show(`<h2>Ezgini çal</h2>
  <p>İlk dokunuşunla kayıt başlar. Üstte Sol, ortada Re, altta La teli var.</p>
  <div class="frets"><div class="fgrid">${STRINGS.map((x,i)=>FRETS.map((f,j)=>`<button class="fret" data-s="${i}" data-j="${j}" type="button">${FNAMES[i][j]}</button>`).join('')).join('')}</div></div>
  <p class="line-now" id="cnt" aria-live="off">0 / ${MAX_NOTES} nota</p>
  <div class="row c"><button class="btn" id="fin" type="button" disabled>Bitir</button><button class="ghost" id="redo" type="button">Baştan al</button><button class="ghost" id="back" type="button">Vazgeç</button></div>
  <p class="note" id="hint">En az 6 nota çal.</p>`);
  const count=()=>{$('#cnt').textContent=`${rec.length} / ${MAX_NOTES} nota`;$('#fin').disabled=rec.length<6;$('#hint').textContent=rec.length<6?'En az 6 nota çal.':rec.length>=MAX_NOTES?'Nota sınırına geldin. Bitir düğmesine bas.':'Bitince Bitir düğmesine bas.';};
  $$('.fret').forEach(b=>b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    const s=+b.dataset.s,j=+b.dataset.j,ts=performance.now();
    pluck(fHz(s,FRETS[j]));
    b.classList.remove('pl');void b.offsetWidth;b.classList.add('pl');later(()=>b.classList.remove('pl'),120);
    if(rec.length>=MAX_NOTES)return;
    if(rec.length){const gap=ts-last;if(gap<90)return;clock+=Math.min(gap,2500);}
    last=ts;
    rec.push([Math.round(clock)/500,s,FRETS[j],FNAMES[s][j]]);
    count();
  }));
  $('#redo').onclick=()=>{rec=[];clock=0;count();};
  $('#back').onclick=tunes;
  $('#fin').onclick=()=>{
    const n=(S.nextSong=(S.nextSong||0)+1);
    S.songs.unshift({name:`Ezgim ${n}`,notes:rec,best:null});
    save();addGears(2);fx.clap();tunes();
  };
}
function playTune(song,beat){
  customSong=song;freeTime=true;CHART=song.notes;BEAT=beat;
  sazView(esc(song.name),null);
}
function tuneDone(hits){
  const song=customSong,n=song.notes.length;
  if(song.best==null||hits>song.best)song.best=hits;
  const earn=hits/n>=.7?2:1;
  addGears(earn);save();
  show(`<p class="win">Bravo!</p>
  <p style="text-align:center;font-size:1.2rem">${esc(song.name)}: ${hits} / ${n} nota tuttu, ${earn} dişli kazandın.</p>
  <div class="row c"><button class="btn" id="again" type="button">Tekrar çal</button><button class="ghost" id="back" type="button">Ezgilerime dön</button></div>`);
  fx.clap();
  $('#again').onclick=()=>playTune(song,BEAT);
  $('#back').onclick=tunes;
}

/* ---------- NOTEBOOK ---------- */
function book(){
  show(`<h2>Mucit Defteri</h2>
  ${S.book.length?'<p>Bir icada dokun, cümlelerini İngilizce dinle.</p>':'<p>Daha icat yok. İlk icadın burada duracak.</p>'}
  <div class="wrap">${S.book.map((b,i)=>`<button class="sheet book" data-i="${i}" type="button">${invSVG(b.body,b.parts)}<div><b>${esc(b.name)}</b><span>${b.lines.map(esc).join(' ')}</span></div></button>`).join('')}</div>
  <div class="row"><button class="btn" id="back" type="button">Atölyeye dön</button></div>`);
  $$('.book').forEach(el=>el.onclick=()=>{const b=S.book[+el.dataset.i];say(`${b.name}. ${b.lines.join(' ')}`);});
  $('#back').onclick=home;
}

/* ---------- TEST SCREEN (open with #test; nothing is saved or sent) ---------- */
function testSeed(){
  const P=(type,color,size)=>({type,color,size}),lv=level(),its=[...lv.items,'wheel','wing','lamp'].slice(0,6),cs=lv.colors,sz=lv.sizes;
  cur={q:[],i:0,total:6,st:{dw:[],slow:0,hint:0,tile:0,typ:0,spoken:0,spokenAll:0},
    pool:its,parts:its.map((t,i)=>P(t,cs[i%cs.length],sz[i%2])),
    w:{body:lv.bodies[0],sel:[0,1,2]},name:'The Test '+BODIES[lv.bodies[0]].En,no:'TEST',
    lines:[]};
  const pa=cur.parts,last=PARTS[pa[2].type];
  cur.lines=[fillT(lv.t1,pa[0]),fillT(lv.t2,pa[1])].map(t=>t.pre+t.word+t.post).concat(last.pre+last.word+last.post);
}
function testPanel(){
  testSeed();
  show(`<h2>Test ekranı</h2>
  <p>Burada yaptıkların kaydedilmez, rapor gönderilmez. Üstteki Mucit Atölyesi yazısı buraya geri getirir.</p>
  <div class="row"><button class="btn" id="tSay" type="button">Sesi dene</button><button class="ghost" id="tSaz" type="button">Saz sesi</button><button class="ghost" id="tMic" type="button">Mikrofonu dene</button></div>
  <p class="sheet" id="tOut" role="status" style="white-space:pre-line">Düğmelere bas, sonuç burada görünecek.</p>
  <h2>Bölüme atla</h2>
  <label for="tLv">Bölüm</label>
  <select id="tLv">${LEVELS.map((l,i)=>`<option value="${i}" ${i===L?'selected':''}>${i+1}. ${l.t}</option>`).join('')}</select>
  <div class="row">
    <button class="ghost" data-t="learn" type="button">Kelimeler</button>
    <button class="ghost" data-t="depot" type="button">1. Depo</button>
    <button class="ghost" data-t="workshop" type="button">2. Atölye</button>
    <button class="ghost" data-t="patent" type="button">3. Patent</button>
    <button class="ghost" data-t="jury" type="button">4. Jüri</button>
    <button class="ghost" data-t="saz" type="button">5. Saz</button>
    <button class="ghost" data-t="tunes" type="button">Kendi Ezgim</button>
    <button class="ghost" data-t="home" type="button">Normal ana ekran</button>
  </div>`);
  const out=t=>{$('#tOut').textContent=t;};
  const info=()=>{pickVoice();return `Konuşma özelliği: ${hasTTS?'var':'yok'}\nCihazdaki ses sayısı: ${voiceCount}\nİngilizce ses: ${voice?voice.name:'bulunamadı'}`;};
  $('#tSay').onclick=()=>{
    out(info()+'\nSes deneniyor…');
    ttsBegan=false;
    say('Hello! This is a sound test.',{done:()=>out(info()+`\nSonuç: ${ttsBegan?'ses çalındı':'ses başlamadı'}`)});
  };
  $('#tSaz').onclick=()=>{pluck(220);out('La teli çalındı. Duyduysan oyun sesleri çalışıyor.');};
  $('#tMic').onclick=()=>{
    if(srOff){out('Mikrofon bu sayfada kullanılamıyor. Oyun "Sıra bende" yöntemiyle devam eder.');return;}
    out('Dinliyorum, İngilizce bir şey söyle…');
    hear(x=>out(x===null?'Mikrofon izni verilmedi veya kullanılamıyor.':x?`Duyulan: ${x}`:'Ses duyulmadı, tekrar dene.'));
  };
  const go={learn,depot,workshop,patent,jury,saz:sazGame,tunes,home};
  $('#tLv').onchange=e=>{L=+e.target.value;testSeed();};
  $$('[data-t]').forEach(b=>b.onclick=()=>go[b.dataset.t]());
}

drawGears();
if(TEST)testPanel();else home();
flushReports();
</script>
